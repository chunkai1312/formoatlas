@if (option()) {
  <div
    echarts
    [options]="option()!"
    [theme]="isDark() ? 'dark' : ''"
    [style.height]="height()"
    (chartGlobalout)="chartGlobalout.emit()"
    class="chart-container"
  ></div>
} @else {
  <div class="chart-empty" [style.height]="height()">
    <i class="pi pi-chart-bar" aria-hidden="true"></i>
    <p>此期間無資料</p>
  </div>
}
