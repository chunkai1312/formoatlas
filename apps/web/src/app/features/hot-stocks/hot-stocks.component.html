<div class="hot-stocks">
  <div class="tab-bar">
    <button class="tab-btn" [class.active]="activeMarket() === 'TSE'" (click)="setMarket('TSE')">上市</button>
    <button class="tab-btn" [class.active]="activeMarket() === 'OTC'" (click)="setMarket('OTC')">上櫃</button>
  </div>

  @if (error()) {
    <div class="page-warning">{{ error() }}</div>
  }

  <section class="section">
    <div class="section-title">漲跌幅排行</div>
    <div class="rank-grid">
      <app-hot-stock-ranking-table
        title="漲幅榜"
        metricLabel="漲跌幅"
        metricKey="changePercent"
        metricKind="percent"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().movers.gainers"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
      <app-hot-stock-ranking-table
        title="跌幅榜"
        metricLabel="漲跌幅"
        metricKey="changePercent"
        metricKind="percent"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().movers.losers"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
    </div>
  </section>

  <section class="section">
    <div class="section-title">成交量值排行</div>
    <div class="rank-grid">
      <app-hot-stock-ranking-table
        title="成交量"
        metricLabel="成交量(張)"
        metricKey="tradeVolume"
        metricKind="volume"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().actives.byVolume"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
      <app-hot-stock-ranking-table
        title="成交金額"
        metricLabel="成交金額(億)"
        metricKey="tradeValue"
        metricKind="value"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().actives.byValue"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
    </div>
  </section>

  <section class="section">
    <div class="section-title">外資買賣超排行</div>
    <div class="rank-grid">
      <app-hot-stock-ranking-table
        title="外資買超"
        metricLabel="買賣超(張)"
        metricKey="finiNet"
        metricKind="net"
        consecutiveDaysKey="finiConsecutiveDays"
        secondaryNetKey="sitcNet"
        secondaryLabel="投信"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().institutional.finiBuy"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
      <app-hot-stock-ranking-table
        title="外資賣超"
        metricLabel="買賣超(張)"
        metricKey="finiNet"
        metricKind="net"
        consecutiveDaysKey="finiConsecutiveDays"
        secondaryNetKey="sitcNet"
        secondaryLabel="投信"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().institutional.finiSell"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
    </div>
  </section>

  <section class="section">
    <div class="section-title">投信買賣超排行</div>
    <div class="rank-grid">
      <app-hot-stock-ranking-table
        title="投信買超"
        metricLabel="買賣超(張)"
        metricKey="sitcNet"
        metricKind="net"
        consecutiveDaysKey="sitcConsecutiveDays"
        secondaryNetKey="finiNet"
        secondaryLabel="外資"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().institutional.sitcBuy"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
      <app-hot-stock-ranking-table
        title="投信賣超"
        metricLabel="買賣超(張)"
        metricKey="sitcNet"
        metricKind="net"
        consecutiveDaysKey="sitcConsecutiveDays"
        secondaryNetKey="finiNet"
        secondaryLabel="外資"
        [watchList]="watchList()"
        [pendingWatchSymbols]="pendingWatchSymbols()"
        [loading]="loading()"
        [rows]="data().institutional.sitcSell"
        (watchlistToggle)="toggleWatchlist($event)"
      ></app-hot-stock-ranking-table>
    </div>
  </section>
</div>
