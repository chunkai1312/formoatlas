<header class="app-toolbar">
  <a routerLink="/" queryParamsHandling="preserve" class="brand-link" aria-label="回到 FormoAtlas 首頁">
    <img src="favicon.svg" class="logo" alt="FormoAtlas logo" />
    <span class="title">FormoAtlas</span>
  </a>

  <nav class="nav-links">
    <a routerLink="/market-overview" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">大盤總覽</a>
    <a routerLink="/sector-flow" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">資金流向</a>
    <a routerLink="/hot-stocks" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">熱門個股</a>
    <a routerLink="/goal-simulation" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">目標模擬</a>
    @if (isLoggedIn()) {
      <a routerLink="/watchlist" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">自選股</a>
    } @else {
      <button class="nav-link nav-button" type="button" (click)="openWatchlistLoginPrompt()">自選股</button>
    }
  </nav>

  <span class="spacer"></span>

  <div class="date-nav">
    <button pButton type="button" class="toolbar-icon-btn" (click)="prevDay()" aria-label="前一日">
      <i class="pi pi-chevron-left" aria-hidden="true"></i>
    </button>

    <p-datepicker
      styleClass="date-picker"
      inputStyleClass="date-display-input"
      [ngModel]="selectedDateObj()"
      (ngModelChange)="onDatePickerChange($event)"
      [maxDate]="maxDate"
      [showIcon]="true"
      iconDisplay="input"
      dateFormat="yy-mm-dd"
      appendTo="body"
      ariaLabel="選擇日期"
    ></p-datepicker>

    <button
      pButton
      type="button"
      class="toolbar-icon-btn"
      (click)="nextDay()"
      [disabled]="isToday()"
      aria-label="後一日"
    >
      <i class="pi pi-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

  <button
    pButton
    type="button"
    class="toolbar-icon-btn"
    (click)="themeService.toggle()"
    [attr.aria-label]="isDark() ? '切換淺色模式' : '切換深色模式'"
  >
    <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
  </button>

  @if (isLoggedIn()) {
    <button
      pButton
      type="button"
      class="toolbar-icon-btn user-avatar-btn"
      (click)="userMenu.toggle($event)"
      [attr.aria-label]="'使用者選單：' + currentUser()?.name"
    >
      <img [src]="currentUser()?.picture" [alt]="currentUser()?.name" class="user-avatar" referrerpolicy="no-referrer" />
    </button>
    <p-menu #userMenu [model]="userMenuItems()" [popup]="true" appendTo="body"></p-menu>
  } @else {
    <button pButton type="button" class="login-btn" (click)="login()" aria-label="使用 Google 帳戶登入">
      <i class="pi pi-sign-in" aria-hidden="true"></i>
      <span>登入</span>
    </button>
  }
</header>
