<mat-toolbar class="app-toolbar">
  <a routerLink="/" queryParamsHandling="preserve" class="brand-link" aria-label="回到 FormoAtlas 首頁">
    <img src="favicon.svg" class="logo" alt="FormoAtlas logo" />
    <span class="title">FormoAtlas</span>
  </a>

  <!-- 頁面導覽 -->
  <nav class="nav-links">
    <a routerLink="/market-overview" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">大盤總覽</a>
    <a routerLink="/sector-flow" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">資金流向</a>
    <a routerLink="/hot-stocks" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">熱門個股</a>
    @if (isLoggedIn()) {
      <a routerLink="/watchlist" queryParamsHandling="preserve" routerLinkActive="active" class="nav-link">自選股</a>
    } @else {
      <button class="nav-link nav-button" type="button" (click)="openWatchlistLoginPrompt()">自選股</button>
    }
  </nav>

  <span class="spacer"></span>

  <!-- 日期導航 -->
  <div class="date-nav">
    <button mat-icon-button (click)="prevDay()" aria-label="前一日">
      <mat-icon>chevron_left</mat-icon>
    </button>

    <div class="date-picker-trigger">
      <button class="date-display" type="button" (click)="picker.open()" mat-button>
        <mat-icon class="cal-icon">calendar_today</mat-icon>
        <span>{{ selectedDateStr() }}</span>
      </button>

      <input
        class="datepicker-anchor"
        [matDatepicker]="picker"
        [value]="selectedDateObj()"
        [max]="maxDate"
        (dateChange)="onDatePickerChange($event.value)"
        readonly
        tabindex="-1"
        aria-hidden="true"
      />
      <mat-datepicker #picker xPosition="end"></mat-datepicker>
    </div>

    <button
      mat-icon-button
      (click)="nextDay()"
      [disabled]="isToday()"
      aria-label="後一日"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <!-- 主題切換 -->
  <button mat-icon-button (click)="themeService.toggle()" [attr.aria-label]="isDark() ? '切換淺色模式' : '切換深色模式'">
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>


  <!-- 登入狀態 -->
  @if (isLoggedIn()) {
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-avatar-btn" [attr.aria-label]="'使用者選單：' + currentUser()?.name">
      <img [src]="currentUser()?.picture" [alt]="currentUser()?.name" class="user-avatar" referrerpolicy="no-referrer" />
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        <span class="user-name">{{ currentUser()?.name }}</span>
        <span class="user-email">{{ currentUser()?.email }}</span>
      </div>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>登出</span>
      </button>
    </mat-menu>
  } @else {
    <button mat-button class="login-btn" (click)="login()" aria-label="使用 Google 帳戶登入">
      <mat-icon>login</mat-icon>
      <span>登入</span>
    </button>
  }
</mat-toolbar>
<!-- 提供 MatNativeDateModule 令 datepicker 正常運作 -->
